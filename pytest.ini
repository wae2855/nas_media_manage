[pytest]
testpaths = tests
addopts = -ra
markers =
    ui: tests that require Playwright or browser automation
    external_service: tests that require an already running service, usually http://localhost:9855
    self_started_service: tests that start a local service inside the test process
    live_e2e: end-to-end tests that require real local configuration, network, or provider credentials
    known_failure: pre-existing failures tracked in docs/testing/known-failures.md
