# ============================================================
# NAS影视自动化入库系统 - 生产环境配置模板
# ============================================================
# 使用说明：
#   1. 复制此文件为 config.prod.yaml
#   2. 搜索 "⚠️ 必须修改" 标记，填写你的实际配置
#   3. 其他项保持默认即可
# ============================================================


server:
  host: "0.0.0.0"
  port: 9855

# ⚠️ 必须修改: 改为你的NAS下载目录
source_dir: "/vol1/downloads/complete"
# ⚠️ 必须修改: 改为你的NAS临时目录（建议与source同磁盘）
temp_dir: "/vol1/nas-media-importer/temp"
# ⚠️ 必须修改: 改为你的NAS日志目录
log_dir: "/vol1/nas-media-importer/logs"

source_dir_scan:
  recursive: true
  max_depth: 5
  ignore_patterns:
    - "*.tmp"
    - ".DS_Store"
    - "*partial*"

video_extensions:
  - ".mkv"
  - ".mp4"
  - ".avi"
  - ".ts"
  - ".mov"
  - ".wmv"
  - ".m2ts"
  - ".flv"

subtitle_extensions:
  - ".srt"
  - ".ass"
  - ".ssa"
  - ".vtt"
  - ".sub"

llm:
  provider: "openai"
  # ⚠️ 必须修改: 改为你的API密钥
  api_key: "YOUR_API_KEY_HERE"
  # ⚠️ 必须修改: 改为你的API地址（如使用其他服务）
  base_url: "https://api.minimaxi.com/v1"
  # ⚠️ 必须修改: 改为你使用的模型名称
  model: "MiniMax-M2.5"
  timeout: 30
  max_retries: 2
  retry_delay: 3
  fallback_model: ""
  confidence_threshold: 0.8

dimensions:
  - name: media_type
    label: 影视类型
    values:
      - "movie"
      - "tv"
    ai_prompt: "请判断这是电影还是电视剧（movie/tv）"
    ai_hint: "请仅返回movie或tv"

  - name: documentary
    label: 是否纪录片
    values:
      - "yes"
      - "no"
    ai_prompt: "请判断是否为纪录片（yes/no）"

  - name: restricted
    label: 是否限制级
    values:
      - "yes"
      - "no"
    ai_prompt: "请判断是否为限制级内容（yes/no）"

filename_templates:
  movie: "{title_cn}.{title_en}.{year}.{resolution}.{quality}.{ext}"
  tv: "{title_cn}.{title_en}.{year}.S{season:02d}E{episode:02d}.{resolution}.{quality}.{ext}"
  subtitle: "{video_filename}.{lang}.{ext}"

# ⚠️ 必须修改: 将 /vol1/media 改为你的NAS媒体库根目录
path_rules:
  - conditions:
      media_type: "tv"
      documentary: "no"
      restricted: "no"
    template: "/vol1/media/电视剧/{title_cn} ({year})/Season {season}/"

  - conditions:
      media_type: "tv"
      documentary: "no"
      restricted: "yes"
    template: "/vol1/media/TV-R/电视剧/{title_cn} ({year})/Season {season}/"

  - conditions:
      media_type: "movie"
      documentary: "no"
      restricted: "no"
    template: "/vol1/media/电影/{year}/"

  - conditions:
      media_type: "movie"
      documentary: "no"
      restricted: "yes"
    template: "/vol1/media/x-rated/电影/{year}/"

  - conditions:
      media_type: "movie"
      documentary: "yes"
      restricted: "no"
    template: "/vol1/media/纪录片/movie/{title_cn} ({year})/"

  - conditions:
      media_type: "tv"
      documentary: "yes"
      restricted: "no"
    template: "/vol1/media/纪录片/TV/{title_cn} ({year})/"

  - conditions:
      media_type: "movie"
      documentary: "yes"
      restricted: "yes"
    template: "/vol1/media/x-rated/movie/{title_cn} ({year})/"

  - conditions:
      media_type: "tv"
      documentary: "yes"
      restricted: "yes"
    template: "/vol1/media/TV-R/TV/{title_cn} ({year})/"

  - conditions: {}
    template: "/vol1/media/其他/"

rules:
  - name: tv_series_folder
    description: "电视剧必须单独文件夹"
    conditions:
      media_type: "tv"
    actions:
      - create_series_folder: true
      - organize_by_season: true
      - use_series_subfolder: "{title_cn} ({year})/"

  - name: movie_year_folder
    description: "电影按年份分文件夹"
    conditions:
      media_type: "movie"
    actions:
      - create_year_folder: true

duplicate_handling:
  strategy: "skip"
  notify: true
  notify_title_only: true

hermes:
  # ⚠️ 可选修改: 如需Hermes通知则启用并配置
  enabled: false
  webhook:
    base_url: "http://YOUR_HERMES_HOST:8644"
    route_name: "media-normalize"
    secret: "YOUR_WEBHOOK_SECRET"
    timeout: 30
    max_retries: 3
    retry_delay: 5
  events:
    - batch_start
    - batch_complete
    - program_error

file_watcher:
  enabled: true
  poll_interval: 10
  ignore_patterns:
    - "*.tmp"
    - ".DS_Store"
    - "*partial*"

task_queue:
  persistence_path: "data/tasks.json"
  max_concurrent: 1
  retry_on_failure: false
  auto_delete_success: true
  auto_delete_failed: false
  history_retention_days: 90

hooks:
  before_process: ""
  after_success: ""
  after_failure: ""

logging:
  level: "INFO"
  format: "json"
  max_size_mb: 100
  backup_count: 5
