<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>片库搭建 · 长胶卷流程轨 Demo v2</title>
<link rel="stylesheet" href="demo-config-reel.css" />
</head>
<body>
<div class="demo-page">
    <header class="demo-header">
        <span class="demo-tag">DEMO v3</span>
        <h1>片库搭建 · 长胶卷流程轨</h1>
        <p>整条胶卷作为流程轨，每一格画面就是一个步骤。暖棕底、间隙纯黑、图片轻模糊、文字更小更轻。</p>
    </header>

    <section class="reel-demo" aria-label="片库搭建流程轨">
        <div class="reel-track">
            <ol class="reel-frames" role="list">
                <li class="reel-frame is-active">
                    <button type="button" data-stage="start">
                        <span class="reel-frame-img"><img src="/media_importer/webui/assets/config-stage/start.jpeg" alt="" /></span>
                        <span class="reel-frame-label">开始</span>
                    </button>
                </li>
                <li class="reel-frame">
                    <button type="button" data-stage="source">
                        <span class="reel-frame-img"><img src="/media_importer/webui/assets/config-stage/source.jpeg" alt="" /></span>
                        <span class="reel-frame-label">源目录</span>
                    </button>
                </li>
                <li class="reel-frame">
                    <button type="button" data-stage="temp">
                        <span class="reel-frame-img"><img src="/media_importer/webui/assets/config-stage/temp.jpeg" alt="" /></span>
                        <span class="reel-frame-label">中转目录</span>
                    </button>
                </li>
                <li class="reel-frame">
                    <button type="button" data-stage="recycle">
                        <span class="reel-frame-img"><img src="/media_importer/webui/assets/config-stage/recycle.jpeg" alt="" /></span>
                        <span class="reel-frame-label">回收目录</span>
                    </button>
                </li>
                <li class="reel-frame">
                    <button type="button" data-stage="scrape">
                        <span class="reel-frame-img"><img src="/media_importer/webui/assets/config-stage/scrape.jpeg" alt="" /></span>
                        <span class="reel-frame-label">刮削配置</span>
                    </button>
                </li>
                <li class="reel-frame">
                    <button type="button" data-stage="ai">
                        <span class="reel-frame-img"><img src="/media_importer/webui/assets/config-stage/ai.jpeg" alt="" /></span>
                        <span class="reel-frame-label">AI 配置</span>
                    </button>
                </li>
                <li class="reel-frame">
                    <button type="button" data-stage="rules">
                        <span class="reel-frame-img"><img src="/media_importer/webui/assets/config-stage/rules.jpeg" alt="" /></span>
                        <span class="reel-frame-label">入库规则</span>
                    </button>
                </li>
            </ol>
        </div>
    </section>

    <footer class="demo-footer">
        <p>v3 改动：</p>
        <ul>
            <li>底色 → 暖棕渐变 + 噪点纹理（恢复 v1）</li>
            <li>画格间隙 → 仍然纯黑</li>
            <li>图片模糊 → 0.6px（约 40% 的原强度）</li>
            <li>文字 → 13px / weight 500 / alpha 0.88（更小更轻）</li>
        </ul>
    </footer>
</div>
</body>
</html>
